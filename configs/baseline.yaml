# Baseline configuration for local development.
# Paths are relative to the repository root unless overridden by env vars:
#   BER_TRAIN_DIR, BER_TEST_DIR, BER_OUTPUT_DIR

seed: 42
validation_fraction: 0.2

paths:
  train_dir: dataset/train
  test_dir: dataset/test
  output_dir: output
  models_dir: models

blocking:
  methods:
    - exact_normalized_name
    - exact_name_without_legal_suffix
    - exact_normalized_address
    - exact_name_and_address
    - exact_compact_name
    - exact_numeric_signature
  max_candidates_per_s1: 250
  char_tfidf:
    enabled: true
    k_grid: [10, 20, 50, 100]
    k_final: 50
    ngram_range: [3, 5]
    min_df: 2
    max_features: 50000
    analyzer: char_wb

features:
  set: e3_v1
  rarity_fit_on: train_s1_plus_all_s2_s3

sampling:
  max_neg_per_pos: null

model:
  type: gbdt
  params:
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: 1
    verbose: -1

threshold:
  value: 0.7
  grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]

runtime:
  n_jobs: 1
  log_memory_sensitive_ops: true
  stream_submission: true
